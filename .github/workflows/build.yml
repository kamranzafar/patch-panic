# Builds standalone executables for Windows, macOS (Apple Silicon and Intel)
# and Linux with PyInstaller. The build steps themselves live in
# tools/build_executable.sh so they're identical locally and in CI.
#
# - Pushing a tag like v1.2.0 builds everything and attaches the downloads to
#   that GitHub release (creating the release if it doesn't exist yet).
# - "Run workflow" on the Actions tab builds on demand. Fill in "release_tag"
#   (e.g. v1.0.0) to attach the builds to an existing release; leave it empty
#   to just build (the files are then under the run's "Artifacts").

name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes patch_panic tests tools run_game.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import patch_panic; print(patch_panic.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match patch_panic.__version__ ($VERSION)"
            exit 1
          fi

  # Windows and macOS build directly on GitHub's machines.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15          # Apple Silicon
            target: macos-arm64
          - os: macos-15-intel    # Intel Macs
            target: macos-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install ".[build]"
      - name: Build, test and package
        run: tools/build_executable.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: PatchPanic-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # Linux builds inside Debian 11 (glibc 2.31) so the result also runs on older
  # distributions (Ubuntu 20.04+, Debian 11+, Fedora 32+), not just new ones.
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    container: python:3.12-slim-bullseye
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          apt-get update -qq
          apt-get install -y -qq binutils > /dev/null   # PyInstaller needs objdump
          pip install ".[build]"
      - name: Build, test and package
        run: tools/build_executable.sh linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: PatchPanic-linux-x64
          path: out/*
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Patch Panic ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
