[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-panic"
dynamic = ["version"]
description = "Arcade game: defend your workstations from bloatware gremlins."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kamran Zafar" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]
build = ["pyinstaller>=6.22", "pillow>=10"]

[project.scripts]
patch-panic = "patch_panic.app:main"

[tool.setuptools.packages.find]
include = ["patch_panic*"]

[tool.setuptools.dynamic]
version = { attr = "patch_panic.__version__" }

[tool.setuptools.package-data]
patch_panic = ["assets/sprites/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
