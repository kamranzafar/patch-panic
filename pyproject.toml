[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-panic"
version = "1.0.0"
description = "Arcade game: defend your workstations from bloatware gremlins."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kamran Zafar" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
patch-panic = "patch_panic.app:main"

[tool.setuptools]
packages = ["patch_panic"]

[tool.setuptools.package-data]
patch_panic = ["assets/sprites/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
